name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: pip install -e .

      - name: Run test suite
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          for t in \
              test_subnet_expand.py \
              test_priority.py \
              test_scan_diff.py \
              test_nmap_xml_importer.py \
              test_httpx_jsonl_importer.py \
              test_nuclei_json_importer.py \
              test_security_finding_analyzer.py \
              test_unified_report.py \
              test_importer_errors.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: Smoke test — all three import modes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          echo "::group::Nmap XML import"
          ads --import-nmap-xml examples/sample_nmap.xml --environment external --criticality high --no-html
          echo "::endgroup::"

          echo "::group::httpx JSONL import"
          ads --import-httpx-jsonl examples/sample_httpx.jsonl --environment external --criticality medium --no-html
          echo "::endgroup::"

          echo "::group::Nuclei JSONL import"
          ads --import-nuclei-json examples/sample_nuclei.jsonl --environment external --criticality high --no-html
          echo "::endgroup::"
